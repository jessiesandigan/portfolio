<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessie Sandigan</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

@font-face {
    font-family: 'Inter28_Regular';
    src: url('Inter_28pt-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: 'Inter28_Regular', Arial, sans-serif;
letter-spacing: normal;
  }
  a { color: inherit; }

  /* ---------- SHARED CONTAINER ---------- */
  /* Every section of the page uses this for consistent left/right alignment */
  .container {
    width: 90%;
    max-width: 1300px;
    margin: 0 auto;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  /* ---------- HEADER ---------- */
  .my-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    
  }
  .header-inner {
    position: relative;
    margin: 0 auto;
    padding-top: 5rem;
    padding-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .site-name {
    font-size: 16px;
    font-weight: bold;
    color: #000;
    text-decoration: none;
    letter-spacing: normal;
  }
  .nav-links {
    display: flex;
    gap: 50px;
  }
  .nav-links a {
    font-size: 14px;
    color: #000;
    text-decoration: none;
letter-spacing: normal;
  }

.nav-links a[href="index.html"] {
  color: #000;
}

.nav-links a[href="profile.html"],
.nav-links a[href="contact.html"] {
  color: #999;
}
  .nav-links a:hover {
    color: #000;
    
  }
  .menu-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #000;
    padding: 0;
    line-height: 1;
  }

  @media (max-width: 480px) {
    .header-inner {
      flex-direction: row;
      align-items: center;
      padding-top: 1.5rem;
    }
    .menu-toggle {
      display: block;
    }
    .nav-links {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #eee;
      padding: 0 1.5rem;
      gap: 16px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.35s ease;
    }
    .nav-links.open {
      max-height: 200px;
      opacity: 1;
      padding: 1rem 1.5rem;
    }
    .container {
      width: 100%;
      padding-left: 4px;
      padding-right: 4px;
    }
  }

  /* ---------- SECTIONS ---------- */
  section {
    margin: 0 auto;
    padding-top: 0rem;
    padding-bottom: 35rem;
scroll-margin-top: 140px;
  }
  h2.section-title {
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 1.5rem;
    font-weight: normal;
  }

  /* ---------- WORKS GRID ---------- */
  .works-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }

  .hover-box {
    position: relative;
    overflow: hidden;
    border-radius: 0px;
    width: 100%;
  }
  .hover-box img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    aspect-ratio: 3/4;
    cursor: pointer;
  }

  .hover-box::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  @media (hover: hover) and (pointer: fine) {
    .hover-box:hover::after {
      opacity: 1;
    }
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox {
    display: flex;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease;
  }
  .lightbox.open {
    opacity: 1;
    visibility: visible;
  }
  .lightbox-content {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    max-width: 95%;
    max-height: 95%;
    transform: scale(0.85);
    transition: transform 0.2s ease;
  }
  .lightbox.open .lightbox-content {
    transform: scale(1);
  }
  .lightbox img {
    max-width: 70vw;
    max-height: 90vh;
    object-fit: contain;
    flex-shrink: 0;
  }
  .lightbox-label {
    width: 260px;
    flex-shrink: 0;
    align-self: flex-end;
    background: #333;
    border-radius: 12px;
    padding: 1.25rem;
    color: #fff;
    font-size: 14px;
    letter-spacing: 0.02em;
    line-height: 1.5;
    text-align: left;
  }
  .lightbox-label .label-title {
    font-weight: bold;
    margin-bottom: 0.75rem;
    display: block;
  }
  .lightbox-label .label-line {
    display: block;
    margin-bottom: 0.3rem;
  }
  .lightbox-label .label-line:last-child {
    margin-bottom: 0;
  }

  @media (max-width: 600px) {
    .lightbox-content {
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 60vh;
    }
    .lightbox-label {
      width: 90vw;
      align-self: center;
      text-align: center;
    }
  }
  .lightbox-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
  }

  .hover-box {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .hover-box.in-view {
    opacity: 1;
    transform: translateY(0);
  }

</style>
</head>
<body>

  <!-- ============ HEADER ============ -->
  <div class="my-header">
    <div class="header-inner container">
      <a href="index.html" class="site-name">Jessie Sandigan</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">works</a>
        <a href="profile.html">profile</a>
        <a href="contact.html">contact</a>
      </nav>
    </div>
  </div>

  <!-- ============ WORKS ============ -->
  <section id="works" class="container">
    <h2 class="section-title"></h2>
    <div class="works-grid">

      <div class="hover-box" data-artwork>
        <img src="god_descending_purification.jpg" alt="God Descending Purification"
          data-year="2025"
          data-medium="Oil, acrylic, enamel, and wall putty on canvas"
          data-size="62.2 in x 46.4 in"
          data-award="2026 Philippine Art Awards Juror's Choice Award of Merit"
          data-collection="" />
      </div>

      <div class="hover-box" data-artwork>
        <img src="and_we_worshipped_the_beast.jpg" alt="And We Worshipped the Beast"
          data-year="2025"
          data-medium="Oil on canvas"
          data-size="48 in x 36 in"
          data-award="2025 Metrobank Art & Design Excellence Semi-finalist"
          data-collection="Private Collection" />
      </div>

	<div class="hover-box" data-artwork>
        <img src="savior.jpg" alt="Savior"
          data-year="2015"
          data-medium="Oil on canvas"
          data-size="48 in x 36 in"
          data-award="2015 Metrobank Art & Design Excellence Semi-finalist"
          data-collection="" />
      </div>

      </div>
      <!--
        To add more artworks, copy one whole block above (from
        <div class="hover-box" data-artwork> down to its closing </div>)
        and edit the image src + label text.
      -->

    </div>
  </section>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&#10005;</button>
    <div class="lightbox-content">
      <img src="" alt="" id="lightboxImg" />
      <div class="lightbox-label" id="lightboxLabel"></div>
    </div>
  </div>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('navLinks');

  menuToggle.addEventListener('click', function() {
    const isOpen = navLinks.classList.toggle('open');
    menuToggle.innerHTML = isOpen ? '&#10005;' : '&#9776;';
  });

  // Fade artwork images in as they scroll into view
  const artworkObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        artworkObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.hover-box').forEach(function(box) {
    artworkObserver.observe(box);
  });

  // Lightbox: click an artwork to view it full-size
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxLabel = document.getElementById('lightboxLabel');
  const lightboxClose = document.getElementById('lightboxClose');

  document.querySelectorAll('.hover-box img').forEach(function(img) {
    img.addEventListener('click', function() {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;

      const fields = [
        img.getAttribute('data-year'),
        img.getAttribute('data-medium'),
        img.getAttribute('data-size'),
        img.getAttribute('data-award'),
        img.getAttribute('data-collection')
      ].filter(function(f) { return f && f.trim() !== ''; });

      let html = '<span class="label-title">' + img.alt + '</span>';
      fields.forEach(function(f) {
        html += '<span class="label-line">' + f + '</span>';
      });
      lightboxLabel.innerHTML = html;

      lightbox.classList.add('open');
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
    lightboxLabel.textContent = '';
  }

  lightboxClose.addEventListener('click', closeLightbox);

  // Close when clicking the dark background (but not the image itself)
  lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox) {
      closeLightbox();
    }
  });

  // Close on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeLightbox();
    }
  });
</script>

</body>
</html>
